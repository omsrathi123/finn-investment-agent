services:
  - type: web
    name: finn
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python seed_demo.py && python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: FINN_DB_PATH
        value: /tmp/finn.db
      - key: FINN_CACHE_DIR
        value: /tmp/finn-cache
      - key: GEMINI_API_KEY
        sync: false

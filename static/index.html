<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F3F0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.svg">
<title>FINN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F0;--sheet:#FFFFFF;--ink:#15202B;--slate:#5E6B76;--rule:#D8DDD8;--faint:#E7EAE6;
  --sig:#2E35C8;--sig-wash:#E6E8FA;--up:#127552;--dn:#B42318;--warn:#8A5A00;--warn-wash:#FBF1DC;
  --r:12px;--nav:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Instrument Sans",-apple-system,system-ui,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sig);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px;border-radius:6px}
main{max-width:640px;margin:0 auto;padding:0 18px 24px}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 6px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em}
.when{color:var(--slate);font-size:13px}
h1{font-size:26px;line-height:1.2;font-weight:600;margin:10px 0 6px;letter-spacing:-.01em;max-width:30ch}
h2{font-size:17px;font-weight:600;margin:26px 0 4px}
.lede{font-size:18px;line-height:1.45;margin:8px 0 2px;max-width:36ch}
.sub{color:var(--slate);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;padding:0;color:var(--sig);font-weight:600;font-size:14px}
/* filing rows: the score is the signal */
.row{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--rule)}
.score{font-size:24px;font-weight:600;line-height:1;padding-top:2px;color:var(--slate)}
.hot .score{color:var(--sig)}
.meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tick{font-weight:700;background:none;border:0;padding:0;font-size:15px}
.kind{font-size:13px;color:var(--slate)}
.hot .kind{color:var(--sig);font-weight:600}
.time{margin-left:auto;font-size:12px;color:var(--slate)}
.summ{margin:3px 0 0;max-width:60ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why{color:var(--slate);font-size:13px;margin-top:3px}
.acts{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;align-items:center}
.related{margin-top:8px;font-size:13px;color:var(--slate)}
.related summary{cursor:pointer;list-style:none}
.related summary::-webkit-details-marker{display:none}
.related li{margin:4px 0}
.related ul{padding-left:16px;margin:6px 0}
.expand{grid-column:2;margin-top:10px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.routine{margin-top:6px;border-top:1px solid var(--rule);padding-top:12px}
.routine summary{cursor:pointer;color:var(--slate)}
.routine li{padding:6px 0;border-bottom:1px solid var(--faint);font-size:14px;list-style:none}
.routine ul{padding:0;margin:8px 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:6px 4px;font-size:14px}
th{font-weight:500;color:var(--slate);font-size:12px}
td:first-child,th:first-child{text-align:left}
tr+tr td{border-top:1px solid var(--faint)}
.up{color:var(--up)}.dn{color:var(--dn)}
.flag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 7px;background:var(--faint);color:var(--slate)}
.flag.ok{background:#E3F1EA;color:var(--up)}.flag.bad{background:#FBE7E5;color:var(--dn)}.flag.warn{background:var(--warn-wash);color:var(--warn)}
.note{background:var(--warn-wash);color:#5A3B00;border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.empty{padding:18px 0;color:var(--slate)}
.person+.person{border-top:1px solid var(--faint);margin-top:10px;padding-top:10px}
.person b{font-size:16px}
.person ul{margin:6px 0;padding-left:18px}
/* alerts */
.alert{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:13px 0;border-top:1px solid var(--rule)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:transparent}
.unseen .dot{background:var(--sig)}
.alert .t{font-weight:600}
/* holdings */
.hold{display:grid;grid-template-columns:1fr 84px 78px;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--rule);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.hold .px{text-align:right;font-weight:600}
.spark{width:84px;height:28px}
/* research */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:10px}
.tile{background:var(--sheet);padding:10px}
.tile .l{font-size:12px;color:var(--slate)}.tile .v{font-size:17px;font-weight:600;margin-top:2px}
.sec{border-top:1px solid var(--rule);padding:14px 0}
.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h3{margin:0;font-size:16px;font-weight:600}
.cost{font-size:12px;color:var(--slate)}
.read{margin:6px 0 0;max-width:60ch}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:10px}
.bars div{flex:1;background:var(--ink);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.bars div.alt{background:#AEB7BF}
.axis{display:flex;gap:4px;font-size:11px;color:var(--slate)}
.axis span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.status-met{color:var(--up)}.status-missed{color:var(--dn)}.status-partial{color:var(--warn)}.status-unclear{color:var(--slate)}
.case{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.case h4{margin:0 0 4px;font-size:14px}
.case ul{margin:0;padding-left:16px}.case li{margin:6px 0;font-size:14px}
.case small{display:block;color:var(--slate)}
@media(max-width:420px){.case{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
/* ask */
.log{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:80%}
.bot{align-self:stretch}
.composer{position:sticky;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;margin-top:16px;background:var(--paper);padding-top:8px}
.composer input{flex:1;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:11px 12px}
.mic{width:46px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet)}
.mic.on{background:var(--sig);color:#fff;border-color:var(--sig)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;background:var(--sheet);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(21,32,43,.18);
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;z-index:20}
.sheet:not(.open){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(21,32,43,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:19}
.scrim.open{opacity:1;pointer-events:auto}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
label.sl{display:block;margin:12px 0 2px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--sig)}
input[type=date],input[type=text]{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--sheet)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(241,243,240,.96);backdrop-filter:blur(8px);border-top:1px solid var(--rule);display:flex;z-index:10}
nav button{flex:1;border:0;background:none;color:var(--slate);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button[aria-current=page]{color:var(--ink);font-weight:700}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--sig);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.badge:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="m" tabindex="-1"></main>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Alert rules"></section>
<nav aria-label="Sections">
  <button data-t="today" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Today</button>
  <button data-t="alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Alerts<span class="badge" id="badge"></span></button>
  <button data-t="holdings"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/></svg>Holdings</button>
  <button data-t="research"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Research</button>
  <button data-t="ask"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/></svg>Ask</button>
</nav>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], m=$('#m');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href=u=>{try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?esc(x.href):''}catch{return ''}};
const ext=(u,t)=>{const h=href(u);return h?`<a href="${h}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`:''};
async function J(u,o){const r=await fetch(u,o);let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw new Error(d.detail||`Request failed (${r.status})`);return d}
const num=(v,d=0)=>v==null?'–':Number(v).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0});
const pct=v=>v==null?'–':`<span class="${v>0?'up':v<0?'dn':''}">${v>0?'+':''}${num(v,1)}%</span>`;
const pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const store={get(k,d){try{return JSON.parse(localStorage.getItem('finn.'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('finn.'+k,JSON.stringify(v))}catch{}}};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
let S={tab:'today',win:store.get('win',{hours:24}),cfg:null,cats:[]};

/* ---------- shared renderers ---------- */
function ago(iso){if(!iso)return '';const t=new Date(iso.replace(' ','T'));if(isNaN(t))return iso;const h=(Date.now()-t)/36e5;
  return h<1?`${Math.max(1,Math.round(h*60))}m ago`:h<24?`${Math.round(h)}h ago`:t.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function filingRow(f){
  const hot=f.tier==='critical';
  const acts=[];
  if(f.actions.includes('results'))acts.push(`<button class="link" data-results="${esc(f.id)}">Headline numbers</button>`);
  if(f.actions.includes('people'))acts.push(`<button class="link" data-people="${esc(f.id)}">Who is this?</button>`);
  if(f.url)acts.push(ext(f.url,'Filing'));
  const rel=f.related.length?`<details class="related"><summary>+ ${f.related.length} related filing${f.related.length>1?'s':''} from the same event</summary><ul>${f.related.map(r=>`<li>${r.url?ext(r.url,r.title):esc(r.title)} <span class="sub">${esc(ago(r.ts&&toIso(r.ts)))}</span></li>`).join('')}</ul></details>`:'';
  return `<article class="row ${hot?'hot':''}"><div class="score" title="Materiality score out of 100">${f.score}</div>
   <div><div class="meta"><button class="tick" data-stock="${esc(f.symbol)}">${esc(f.symbol)}</button><span class="kind">${esc(f.label)}</span><span class="time">${esc(ago(f.iso))}</span></div>
   <p class="summ">${esc(f.summary||f.title)}</p>${hot&&!f.summary?`<div class="why">${esc(f.why)}</div>`:''}
   ${acts.length?`<div class="acts">${acts.join('')}</div>`:''}${rel}<div class="expand" hidden></div></div></article>`}
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function toIso(ts){const x=/^(\d{2})-(\w{3})-(\d{4}) (.*)$/.exec(ts||'');return x?`${x[3]}-${String(MON[x[2]]+1).padStart(2,'0')}-${x[1]} ${x[4]}`:ts}

async function openResults(btn,id){
  const box=btn.closest('.row,.bot,.alert').querySelector('.expand')||btn.parentElement.nextElementSibling;
  box.hidden=false;btn.disabled=true;box.innerHTML='<div class="sub">Reading the results filing…</div>';
  try{box.innerHTML=resultsPanel(await J('/api/results/'+encodeURIComponent(id)));btn.remove()}
  catch(e){btn.disabled=false;box.innerHTML=`<div class="note">${esc(e.message)}</div>`}}
function resultsPanel(r){
  const cc=r.cross_check?`<span class="flag ${r.cross_check.agrees?'ok':'bad'}">${r.cross_check.agrees?'Matches':'Differs from'} ${esc(r.cross_check.against)}</span>`:'';
  const src=r.source==='screener'?'<span class="flag warn">From Screener’s quarterly table</span>':'<span class="flag">Read from the filing</span>';
  return `<div class="panel">${r.headline?`<p style="margin:0 0 6px;font-weight:600">${esc(r.headline)}</p>`:''}
  <table><tr><th>${esc(r.quarter||'')} · ₹ cr</th><th>This quarter</th><th>QoQ</th><th>YoY</th></tr>
  ${r.rows.map(x=>`<tr><td>${esc(x.metric)}</td><td>${num(x.cur)}</td><td>${pct(x.qoq)}</td><td>${pct(x.yoy)}</td></tr>`).join('')}</table>
  <div class="acts" style="gap:8px">${src}${cc}${r.basis?`<span class="flag">${esc(r.basis)}</span>`:''}${r.source_url?ext(r.source_url,'Verify in filing'):''}</div>
  ${r.note?`<div class="sub" style="margin-top:6px">${esc(r.note)}</div>`:''}
  ${r.cross_check&&!r.cross_check.agrees?`<div class="sub" style="margin-top:6px">${r.cross_check.detail.map(d=>`${esc(d.metric)} ${d.diff_pct>0?'+':''}${d.diff_pct}% vs ₹${num(d.screener)} cr`).join(' · ')} — check consolidated vs standalone.</div>`:''}</div>`}
async function openPeople(btn,id){
  const box=btn.closest('.row,.bot,.alert').querySelector('.expand');box.hidden=false;btn.disabled=true;box.innerHTML='<div class="sub">Looking up who this is…</div>';
  try{box.innerHTML=peoplePanel(await J('/api/people/'+encodeURIComponent(id)));btn.remove()}
  catch(e){btn.disabled=false;box.innerHTML=`<div class="note">${esc(e.message)}</div>`}}
function peoplePanel(p){
  if(!p.people.length)return `<div class="panel sub">No named person in this filing. ${p.source_url?ext(p.source_url,'Open the filing'):''}</div>`;
  return `<div class="panel">${p.people.map(x=>`<div class="person"><b>${esc(x.name)}</b> <span class="flag ${x.incoming?'ok':'bad'}">${esc(x.change||'')}</span>
   <div class="sub">${esc(x.role||'Role not stated')}${x.effective?` · from ${esc(x.effective)}`:''}</div>
   ${x.background?`<p style="margin:6px 0 0">${esc(x.background)}</p><div class="sub">From the filing’s own profile</div>`:''}
   ${x.reason?`<div class="sub">Stated reason: ${esc(x.reason)}</div>`:''}
   ${x.web?`<ul>${x.web.text.split('\n').map(l=>l.replace(/^[\s*•-]+/,'').trim()).filter(Boolean).slice(0,4).map(l=>`<li>${esc(l)}</li>`).join('')}</ul><div class="sub">Web background: ${x.web.sources.map(s=>ext(s.url,s.title)).join(', ')||'search results'}</div>`:''}
   <div class="acts">${ext(x.linkedin,'Find on LinkedIn')}</div></div>`).join('')}
   ${p.notes.length?`<div class="sub" style="margin-top:8px">${p.notes.map(esc).join('. ')}.</div>`:''}</div>`}

/* ---------- Today: the windowed digest ---------- */
const WINS=[[24,'24 hours'],[72,'3 days'],[168,'7 days'],[720,'30 days']];
function winQuery(){const w=S.win;return w.start?`start=${w.start}&end=${w.end}`:`hours=${w.hours}`}
async function today(){
  const w=S.win;
  m.innerHTML=`<div class="top"><span class="brand">FINN</span><span class="when">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</span></div>
  <div class="chips" role="group" aria-label="Time window">${WINS.map(([h,l])=>`<button class="chip" data-win="${h}" aria-pressed="${!w.start&&w.hours==h}">${l}</button>`).join('')}<button class="chip" data-win="custom" aria-pressed="${!!w.start}">${w.start?`${w.start} → ${w.end}`:'Pick dates'}</button></div>
  <div id="custom" hidden style="gap:8px;margin-top:8px;align-items:center;display:flex"><input type="date" id="d1" aria-label="From"><input type="date" id="d2" aria-label="To"><button class="btn small" id="apply">Show</button></div>
  <div id="body"><p class="empty">Loading your portfolio’s filings…</p></div>`;
  $('#custom').hidden=true;
  const span=w.start?'':`&hours=${w.hours}`;
  const [d,b]=await Promise.all([J('/api/feed?'+winQuery()),J('/api/brief?hours='+(w.hours||24)).catch(()=>null)]);
  const total=d.counts.critical+d.counts.notable+d.counts.routine;
  let head;
  if(!d.critical.length&&!d.notable.length){
    head=`<h1>Nothing material ${w.start?'in this range':`in the last ${WINS.find(x=>x[0]==w.hours)?.[1]||w.hours+' hours'}`}.</h1>
    <p class="sub">${total?`${total} routine filing${total>1?'s':''} came in; none needs you.`:'No filings from your holdings in this window.'} ${d.latest?`The latest filing on record is from ${esc(ago(d.latest))}.`:''}</p>
    ${!w.start&&w.hours<720?`<button class="btn quiet small" data-win="${WINS.find(x=>x[0]>w.hours)[0]}" style="margin-top:8px">Widen to ${WINS.find(x=>x[0]>w.hours)[1]}</button>`:''}`;
  }else{
    head=`<h1>${d.critical.length?`${d.critical.length} thing${d.critical.length>1?'s':''} need${d.critical.length>1?'':'s'} you.`:'Nothing urgent.'}</h1>
    <p class="sub">${pl(d.counts.critical+d.counts.notable,'material filing')}, grouped into ${pl(d.critical.length+d.notable.length,'event')}. ${d.counts.routine} routine hidden.</p>
    <div class="acts"><button class="link" id="speak">Read me the brief</button></div>`;
  }
  $('#body').innerHTML=`${head}
   ${d.critical.length?`<h2>Needs you</h2>${d.critical.map(filingRow).join('')}`:''}
   ${d.notable.length?`<h2>Worth knowing</h2>${d.notable.map(filingRow).join('')}`:''}
   ${d.routine.length?`<details class="routine"><summary>${pl(d.counts.routine,'routine filing')}, collapsed</summary><ul>${d.routine.map(r=>`<li><b>${esc(r.symbol)}</b> ${esc(r.summary||r.title)} <span class="sub">${esc(r.label)}</span></li>`).join('')}</ul></details>`:''}`;
  const sp=$('#speak');if(sp&&b)sp.onclick=()=>speak(b.text,sp);
}
function speak(text,btn){if(!('speechSynthesis' in window))return toast('Voice is not supported in this browser');
  if(speechSynthesis.speaking){speechSynthesis.cancel();btn&&(btn.textContent='Read me the brief');return}
  const u=new SpeechSynthesisUtterance(text.replace(/\bQoQ\b/g,'quarter on quarter').replace(/\bYoY\b/g,'year on year'));
  u.lang='en-IN';u.rate=1.04;const v=speechSynthesis.getVoices().find(v=>v.lang==='en-IN');if(v)u.voice=v;

function ask(){
  m.innerHTML=`<div class="top"><span class="brand">Ask FINN</span><span class="when">Type or talk</span></div>
  <h1>What do you want to know?</h1><div class="suggest">${['What changed this week?','Any unusual moves?','Bharti Airtel results','Who joined Max Healthcare?','Is Polycab’s cash real?','Did Dixon deliver on guidance?','Bull and bear on TRENT'].map(s=>`<button class="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <div class="log" id="log">${LOG.join('')}</div>
  <form class="composer" id="cf"><input id="q" placeholder="Ask about your portfolio or any NSE company" autocomplete="off" aria-label="Question"><button type="button" class="mic" id="mic" aria-label="Speak your question">🎙</button><button class="btn">Ask</button></form>`;
  $('#cf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(q){$('#q').value='';askQ(q)}};
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('#mic');
  if(!SR)mic.hidden=true;else mic.onclick=()=>{const r=new SR();r.lang='en-IN';r.interimResults=false;mic.classList.add('on');r.onresult=e=>{askQ(e.results[0][0].transcript,true)};r.onend=()=>mic.classList.remove('on');r.onerror=()=>{mic.classList.remove('on');toast('Did not catch that')};r.start()}}
async function askQ(q,voice){
  const log=$('#log');const me=`<div class="me">${esc(q)}</div>`;LOG.push(me);log.insertAdjacentHTML('beforeend',me+'<div class="bot" id="pending"><span class="sub">Thinking…</span></div>');
  const box=$('#pending');box.removeAttribute('id');
  try{const r=await J('/api/ask?q='+encodeURIComponent(q));box.innerHTML=await renderAnswer(r);if(voice&&r.text)speak(r.text)}
  catch(e){box.innerHTML=`<div class="note">${esc(e.message)}</div>`}
  LOG.push(box.outerHTML);box.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function renderAnswer(r){
  const sym=r.symbol;
  switch(r.intent){
    case 'digest':{const b=await J('/api/brief?hours='+r.hours);return `<p class="read">${esc(b.text)}</p>${b.top.map(filingRow).join('')}`}
    case 'alerts':{const d=await J('/api/inbox');const xs=d.alerts.filter(a=>a.kind==='price').slice(0,6);return xs.length?`<p class="read">Moves that crossed your thresholds this week:</p>${xs.map(alertRow).join('')}`:'<p class="read">No unusual moves at your current thresholds.</p>'}
    case 'results':return r.id?`<p class="read">${esc(r.text)}</p><div class="expand">${resultsPanel(await J('/api/results/'+encodeURIComponent(r.id)))}</div>`:`<p class="read">${esc(r.text)}</p>`;
    case 'people':return r.id?`<p class="read">${esc(r.filing.summary||r.text)}</p><div class="expand">${peoplePanel(await J('/api/people/'+encodeURIComponent(r.id)))}</div>`:`<p class="read">${esc(r.text)}</p>`;
    case 'business':case 'financial':case 'trajectory':case 'balance':case 'cash':case 'guidance':case 'nvn':case 'bullbear':{
      const d=await J(`/api/research/${encodeURIComponent(sym)}/${r.intent}`);return `<p class="sub"><b>${esc(sym)}</b> · <button class="link" data-research="${esc(sym)}">open full research</button></p>${renderSection(r.intent,d)}`}
    case 'stock':return `<p class="read">${esc(r.text||'')}</p><div class="acts"><button class="btn small" data-research="${esc(sym)}">Research ${esc(sym)}</button><button class="btn quiet small" data-stock="${esc(sym)}">Price & filings</button></div>`;
    default:return `<p class="read">${esc(r.text||'Ask about filings, moves, results, management, or any section of company research.')}</p>`}}

/* ---------- navigation ---------- */
const TABS={today,alerts,holdings,research:()=>research(),ask};
function markNav(t){$$('nav button').forEach(b=>b.dataset.t===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))}
function go(t){S.tab=t;markNav(t);
  window.scrollTo(0,0);Promise.resolve(TABS[t]()).catch(e=>m.innerHTML=`<div class="note">${esc(e.message)}</div>`)}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-stock],[data-results],[data-people],[data-win],[data-research],[data-section],[data-q],[data-go]');if(!t)return;
  if(t.dataset.stock)return stock(t.dataset.stock);
  if(t.dataset.results)return openResults(t,t.dataset.results);
  if(t.dataset.people)return openPeople(t,t.dataset.people);
  if(t.dataset.section)return loadSection(t);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.q)return askQ(t.dataset.q);
  if(t.dataset.research){S.tab='research';markNav('research');window.scrollTo(0,0);return research(t.dataset.research)}
  if(t.dataset.win){if(t.dataset.win==='custom'){const c=$('#custom');c.hidden=!c.hidden;
      const to=new Date(),fr=new Date(Date.now()-6*864e5);$('#d1').value=S.win.start||fr.toISOString().slice(0,10);$('#d2').value=S.win.end||to.toISOString().slice(0,10);
      $('#apply').onclick=()=>{S.win={start:$('#d1').value,end:$('#d2').value};store.set('win',S.win);today()};return}
    S.win={hours:+t.dataset.win};store.set('win',S.win);today()}});
go('today');poll();
</script>
</body>
</html>
